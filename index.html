<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kainan Sa Tabi – Quick-Find Menu</title>
<icon href="KSTLogo.png" type="image/png">
<link href="canteen.css" rel="stylesheet">
</head>
<body>

<!-- HEADER -->
<header>
  <div class="brand">
    <div class="brand-icon">
       <img src="KSTLogo.png" alt="Canteen Icon" style="width:50px; height:50px;">
    </div>
    <div class="brand-text">
      <h1>Kainan Sa Tabi</h1>
      <span>Quick-Find Menu</span>
    </div>
  </div>

  <button class="cart-btn" onclick="scrollToCart()">
    <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96C5 16.1 5.9 17 7 17h11v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63H18c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0022.46 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
    CART
    <span id="cart-badge" class="cart-badge" style="display:none">0</span>
  </button>
</header>

<!-- MAIN -->
<div class="main-layout">
  <!-- LEFT -->
  <div>
    <p class="hero-text">Find your food, <em>fast.</em></p>

    <!-- Controls -->
    <div class="controls">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="searchInput" placeholder="Search menu…" oninput="renderMenu()">
      </div>
      <select id="priceFilter" onchange="renderMenu()">
        <option value="">All Prices</option>
        <option value="15">Under ₱15</option>
        <option value="25">Under ₱25</option>
        <option value="50">Under ₱50</option>
        <option value="100">Under ₱100</option>
      </select>
      <select id="catFilter" onchange="renderMenu()">
        <option value="">All Categories</option>
        <option value="Rice Meals">Rice Meals</option>
        <option value="Drinks">Drinks</option>
        <option value="Snacks">Snacks</option>
      </select>
    </div>

    <!-- Results bar -->
    <div class="results-bar">
      <span class="results-count" id="resultsCount">Showing 6 items</span>
      <div class="sort-wrap">
        <span>Sort by</span>
        <select id="sortBy" onchange="renderMenu()">
          <option value="default">Default</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>
    </div>

    <!-- Menu grid -->
    <div class="menu-grid" id="menuGrid"></div>
  </div>

  <!-- RIGHT: CART -->
  <div class="cart-panel" id="cartPanel">
    <div class="cart-header">Your Cart</div>
    <div class="cart-items" id="cartItems">
      <div class="cart-empty-msg">Your cart is empty.<br>Add something tasty! 🍽️</div>
    </div>
    <div class="cart-divider"></div>
    <div class="cart-subtotal">
      <span>Subtotal</span>
      <span class="cart-total-val" id="cartTotal">₱0.00</span>
    </div>
    <button class="checkout-btn" id="checkoutBtn" disabled onclick="checkout()">View Cart &amp; Checkout</button>
  </div>
</div>

<!-- FOOTER -->
<footer>All rights reserved. &copy; 2026 Kainan Sa Tabi. </footer>

<!-- TOAST -->
<div id="toast">
  <div class="toast-check">
    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
  </div>
  <span id="toastMsg">Item added!</span>
  <button class="toast-close" onclick="hideToast()">✕</button>
</div>

<script src="canteen.js"></script>
</body>
</html>
